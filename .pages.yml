# Pages CMS (pagescms.org). The client logs in with an email link, edits what is below, and
# every save is a commit on this repo, which Netlify builds and publishes.
# Field names must match content/site.json and content/pages/*.json exactly.
media:
  input: public/media
  output: /media
  extensions: [jpg, jpeg, png, webp, svg, mp4]

content:
  - name: site
    label: Site settings
    description: Your name, contact details, languages, prices and student quotes. These show on every page.
    type: file
    path: content/site.json
    format: json
    fields:
      - name: brandName
        label: Brand name
        type: string
      - name: tagline
        label: Tagline (one line, shows in the footer and in Google)
        type: string
      - name: liveOrigin
        label: Live website address (set once by YoungCaesar, for example https://yourdomain.com)
        type: string
      - name: gaId
        label: Google Analytics ID (starts with G-)
        type: string
      - name: teacher
        label: About you
        type: object
        fields:
          - { name: name, label: Your name, type: string }
      - name: contact
        label: Contact details
        type: object
        fields:
          - { name: email, label: Email (inquiries are sent here), type: string }
          - { name: phone, label: Phone, type: string }
          - { name: instagram, label: Instagram link, type: string }
          - { name: area, label: Where you teach (one line), type: string }
      - name: languages
        label: Languages
        type: object
        list: true
        fields:
          - { name: name, label: Language, type: string }
          - { name: blurb, label: Short description, type: text }
          - { name: levels, label: Levels you teach, type: string }
      - name: rhythm
        label: How often (one or two sentences)
        type: text
      - name: formats
        label: Lesson formats
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string }
          - { name: text, label: Description, type: text }
      - name: showPrices
        label: Show prices on the website
        type: boolean
      - name: prices
        label: Prices
        type: object
        list: true
        fields:
          - { name: label, label: Name, type: string }
          - { name: price, label: Price (for example $55), type: string }
          - { name: note, label: Note (per hour, per person...), type: string }
      - name: testimonials
        label: Student quotes
        type: object
        list: true
        fields:
          - { name: quote, label: Quote, type: text }
          - { name: name, label: Who said it (first name and neighborhood is enough), type: string }
      - name: availability
        label: When you are usually available
        type: string

  - name: pages
    label: Pages
    description: The text of each page. Leave a blank line between paragraphs.
    type: collection
    path: content/pages
    format: json
    view:
      fields: [title]
    fields:
      - { name: title, label: Headline, type: string }
      - { name: metaTitle, label: Title in Google (under 60 characters), type: string }
      - { name: metaDescription, label: Description in Google (under 155 characters), type: text }
      - { name: eyebrow, label: Small line above the headline, type: string }
      - { name: intro, label: Intro paragraph, type: text }
      - { name: heroImage, label: Main photo, type: image }
      - { name: heroImageAlt, label: Photo description (for accessibility), type: string }
      - name: sections
        label: Sections
        type: object
        list: true
        fields:
          - { name: heading, label: Heading, type: string }
          - { name: body, label: Text, type: text }
          - { name: image, label: Photo (optional), type: image }
          - { name: imageAlt, label: Photo description, type: string }
      - name: faq
        label: Questions and answers
        type: object
        list: true
        fields:
          - { name: q, label: Question, type: string }
          - { name: a, label: Answer, type: text }
      - { name: ctaLabel, label: Button text, type: string }
